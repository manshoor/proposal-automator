<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proposal Automator — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>

  <div class="page-wrap">

    <header class="page-header">
      <div class="header-inner">
        <img src="../icons/icon48.png" alt="Logo" class="header-logo" />
        <div>
          <h1 class="page-title">Settings</h1>
          <p class="page-subtitle">Upwork Proposal Automator</p>
        </div>
      </div>
    </header>

    <main class="form-card">

      <!-- Auth Section -->
      <div class="field-group">
        <label class="field-label">Account</label>

        <!-- Logged-in state -->
        <div id="auth-status" class="hidden" style="display:flex;align-items:center;gap:12px;padding:12px;background:#f0fdf4;border-radius:8px;border:1px solid #bbf7d0;">
          <span style="font-size:20px;">&#9989;</span>
          <div style="flex:1;">
            <div style="font-weight:600;color:#166534;" id="auth-email">user@email.com</div>
            <div style="font-size:12px;color:#4ade80;">Logged in</div>
          </div>
          <button type="button" id="btn-logout" class="btn" style="background:#ef4444;color:#fff;padding:6px 16px;font-size:12px;">Logout</button>
        </div>

        <!-- Login form -->
        <div id="auth-login">
          <div style="margin-bottom:10px;">
            <input type="email" id="login-email" class="field-input" placeholder="Email" autocomplete="email" />
          </div>
          <div style="margin-bottom:10px;">
            <input type="password" id="login-password" class="field-input" placeholder="Password" autocomplete="current-password" />
          </div>
          <div style="display:flex;align-items:center;gap:12px;">
            <button type="button" id="btn-login" class="btn btn-primary">Login</button>
            <span id="login-feedback" class="save-feedback hidden" style="color:#ef4444;"></span>
          </div>
          <p class="field-hint">Login with your dashboard account. Register at your dashboard first if you don't have one.</p>
        </div>
      </div>

      <!-- Backend URL -->
      <div class="field-group">
        <label for="backend-url" class="field-label">Backend URL</label>
        <input
          type="url"
          id="backend-url"
          class="field-input"
          placeholder="http://localhost:3002"
        />
        <p class="field-hint">The URL of your backend server. Saved automatically.</p>
      </div>

    </main>

  </div>

  <script src="../lib/constants.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="../lib/api.js"></script>
  <script src="options.js"></script>
</body>
</html>
