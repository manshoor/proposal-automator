name: CI

# Workflow uses no untrusted user input in run: commands — all inputs are
# hardcoded npm args + checkout content. No injection surface.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run vitest
        working-directory: backend
        run: npm test

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build (catches syntax / type / RSC errors)
        working-directory: dashboard
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: '1'

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: upwork_proposals
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            dashboard/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci

      - name: Install Playwright browsers
        working-directory: dashboard
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: backend
        run: |
          node server.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          # Poll /health/live until ready
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/health/live && break
            sleep 1
          done
        env:
          NODE_ENV: test
          PORT: '3000'
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: upwork_proposals
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-not-for-production
          REFRESH_SECRET: test-refresh-not-for-production
          CORS_ORIGIN: 'http://localhost:3001'

      - name: Build + start dashboard
        working-directory: dashboard
        run: |
          npm run build
          npm start -- --port 3001 > /tmp/dashboard.log 2>&1 &
          echo $! > /tmp/dashboard.pid
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3001/login && break
            sleep 1
          done
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: '1'
          INTERNAL_API_BASE: http://localhost:3000
          PORT: '3001'

      - name: Run Playwright tests
        working-directory: dashboard
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3001
          E2E_API_BASE: http://localhost:3000

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dashboard/playwright-report/
          retention-days: 7

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "===== backend.log ====="
          cat /tmp/backend.log || true
          echo "===== dashboard.log ====="
          cat /tmp/dashboard.log || true
