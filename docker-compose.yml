services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    volumes:
      - ./backend:/app           # Source code mount for hot-reload
      - /app/node_modules        # Anonymous volume — keeps node_modules inside Docker only
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3003:3000"
    volumes:
      - ./dashboard:/app         # Source code mount for hot-reload
      - /app/node_modules        # Anonymous volume — keeps node_modules inside Docker only
      - /app/.next               # Anonymous volume — keeps .next build cache inside Docker
    environment:
      - API_URL=http://backend:3000
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: upwork_proposals
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data   # Stored locally in ./data/postgres/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
